services:
  backend:
    build: ./backend
    environment:
      # Externalised config; override as needed. AI stays disabled unless set.
      SM_CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
      SM_AI_PROVIDER: "${SM_AI_PROVIDER:-}"
      SM_AI_API_KEY: "${SM_AI_API_KEY:-}"
      SM_AI_IMAGE_PROVIDER: "${SM_AI_IMAGE_PROVIDER:-}"
    volumes:
      - sm_data:/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  sm_data:
